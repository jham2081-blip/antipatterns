name: antipatterns-integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antipatterns-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Source and document integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile add_pattern.py

      - name: Confirm canonical skill artifacts
        run: |
          test -f README.md
          test -f ANTIPATTERNS.md
          test -f SKILL.md
          test -f antipatterns.skill

      - name: Validate in-repository Markdown links
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('.').resolve()
          bad = []
          rx = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for md in Path('.').rglob('*.md'):
              for raw in rx.findall(md.read_text(encoding='utf-8')):
                  target = raw.strip().split()[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (md.parent / target).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      # GitHub-relative navigation such as ../../releases is
                      # outside the checkout and is not an in-repo file link.
                      continue
                  if not resolved.exists():
                      bad.append((md, raw))
          if bad:
              for md, raw in bad:
                  print(f'{md}: {raw}')
              raise SystemExit(1)
          print('All in-repository Markdown links resolve.')
          PY
